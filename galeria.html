<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <title>SITE</title>

</head>

<body class="galeria_background_img">
    <div class="header-background">
        <div class="topbar">
            <nav class="navbar">
                <img src="/img/logo.png" alt="Logo" class="logo">
                <div class="box-1">
                    <a href="/index.html" class="btn btn-one"><span>HOME</span></a>
                    <a href="/sobre.html" class="btn btn-one"><span>SOBRE</span></a>
                    <a href="/contato.html" class="btn btn-one"><span>CONTATO</span></a>
                    <a href="/galeria.html" class="btn btn-one"><span>GALERIA</span></a>
                </div>
            </nav>
        </div>
    </div>

    <section class="titulo"> GALERIA DE FOTOS</section><br>

    <style>
       
        .container { position: relative; width: 80%; max-width: 1200px; height: 700px; overflow: hidden; border-radius: 50px; box-shadow: 0 40px 80px rgba(0,0,0,0.9); }
        
        .galeria { display: flex; width: 100%; height: 100%; transition: transform 0.5s ease-in-out; }
        
        .foto { width: 100%; height: 100%; flex-shrink: 0; object-fit: cover; }
        
        .botao { position: absolute; top: 50%; transform: translateY(-50%); background-color: rgba(0,0,0,0.6); color: white; border: none; padding: 15px; cursor: pointer; font-size: 18px; border-radius: 50%; z-index: 10; }
        
        .botao:hover { background-color: rgba(0,0,0,0.8); }
        .prev { left: 10px; }
        .next { right: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="galeria" id="galeria">
        <!-- Adicione suas fotos aqui -->
        <img src="/img/p1.jpeg" alt="Foto 1" class="foto">
        <img src="/img/p2.jpeg" alt="Foto 2" class="foto">
        <img src="/img/p3.jpeg" alt="Foto 3" class="foto">
        <img src="/img/p4.jpeg" alt="Foto 4" class="foto">
    </div>
    
    <button class="botao prev" onclick="mudarFoto(-1)">&#10094;</button>
    <button class="botao next" onclick="mudarFoto(1)">&#10095;</button>
</div>
<script>
    let indiceAtual = 0;
    const galeria = document.getElementById('galeria');
    const fotos = document.querySelectorAll('.foto');
    const totalFotos = fotos.length;

    function mudarFoto(direcao) {
        indiceAtual += direcao;

        if (indiceAtual >= totalFotos) {
            indiceAtual = 0;
        } else if (indiceAtual < 0) {
            indiceAtual = totalFotos - 1;
        }

        const offset = -indiceAtual * 100;
        galeria.style.transform = `translateX(${offset}%)`;
    }
</script>
   
</body>


</html>
